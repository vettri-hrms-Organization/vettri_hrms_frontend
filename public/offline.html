<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10172A" />
    <title>Offline · Vettri HRMS</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        font-family: 'Manrope Variable', 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #F6F8FC; color: #172033;
      }
      .card { max-width: 380px; width: 100%; text-align: center; background: #fff; border: 1px solid #E5EAF2; border-radius: 12px; padding: 32px 24px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #667085; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
      button { appearance: none; border: 0; border-radius: 8px; background: #4169E1; color: #fff; font: inherit; font-weight: 600; padding: 12px 20px; width: 100%; min-height: 48px; cursor: pointer; }
      @media (prefers-color-scheme: dark) {
        body { background: #0B1120; color: #E6EAF2; }
        .card { background: #10172A; border-color: #1E293B; }
        p { color: #A3ADC2; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/vettri-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Vettri needs a connection to check you in, apply leave or load payslips. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
